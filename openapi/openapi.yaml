components:
  parameters:
    BootstrapAuthorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Server-issued Bearer bootstrap credential.
    IdentityAuthorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer access JWT issued by the local identity module.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: Optional bounded request correlation identifier; invalid values are replaced.
    CausationId:
      name: X-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    CorrelationId:
      description: Correlation identifier assigned to this request.
      schema:
        type: string
  schemas:
    QrResolveRequest:
      type: object
      additionalProperties: false
      properties:
        payload:
          type: string
      required:
        - payload
    QrIssueRequest:
      type: object
      additionalProperties: false
      properties:
        entityType:
          type: string
          enum:
            - Material
        entityId:
          type: string
      required:
        - entityType
        - entityId
    QrResolution:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
        entityType:
          type: string
          enum:
            - Material
        entityId:
          type: string
        status:
          type: string
          enum:
            - RESOLVED
            - UNAVAILABLE
        name:
          type: string
        code:
          type: string
        active:
          type: boolean
      required:
        - version
        - entityType
        - entityId
        - status
    QrIssueResponse:
      type: object
      additionalProperties: false
      properties:
        qrCodeId:
          type: string
        payload:
          type: string
        version:
          type: integer
      required:
        - qrCodeId
        - payload
        - version
    SyncAggregate:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "id"
      properties:
        type:
          type: "string"
        id:
          type: "string"
    SyncAttachmentIntent:
      type: "object"
      additionalProperties: false
      required:
        - "localAttachmentId"
        - "ownerRef"
        - "evidenceType"
        - "sha256"
        - "mime"
        - "sizeBytes"
        - "required"
      properties:
        localAttachmentId:
          type: "string"
        ownerRef:
          type: "string"
        evidenceType:
          type: "string"
        sha256:
          type: "string"
        mime:
          type: "string"
        sizeBytes:
          type: "integer"
        required:
          type: "boolean"
    SyncCommand:
      type: "object"
      additionalProperties: false
      required:
        - "localCommandId"
        - "idempotencyKey"
        - "deviceSeq"
        - "aggregate"
        - "type"
        - "commandVersion"
        - "observedAt"
        - "offlineAuthId"
        - "payload"
        - "provenance"
        - "attachments"
      properties:
        localCommandId:
          type: "string"
        idempotencyKey:
          type: "string"
        deviceSeq:
          type: "integer"
        aggregate:
          $ref: "#/components/schemas/SyncAggregate"
        baseVersion:
          type: "integer"
        type:
          type: "string"
        commandVersion:
          type: "integer"
        observedAt:
          type: "string"
        offlineAuthId:
          type: "string"
        payload:
          type: "object"
          additionalProperties: true
        provenance:
          type: "object"
          additionalProperties: true
        attachments:
          type: "array"
          items:
            $ref: "#/components/schemas/SyncAttachmentIntent"
    SyncResult:
      type: "object"
      additionalProperties: false
      required:
        - "localCommandId"
        - "status"
        - "receivedAt"
      properties:
        localCommandId:
          type: "string"
        status:
          type: "string"
          enum:
            - "ACCEPTED"
            - "CONFLICT"
            - "REJECTED"
            - "ACTION_REQUIRED"
        code:
          type: "string"
        canonical:
          type: "object"
          additionalProperties: true
        aggregateVersion:
          type: "integer"
        receivedAt:
          type: "string"
        localIntent:
          $ref: "#/components/schemas/SyncCommand"
    SyncRegisterRequest:
      type: "object"
      additionalProperties: false
      required:
        - "deviceId"
        - "installationId"
        - "schemaVersion"
      properties:
        deviceId:
          type: "string"
        installationId:
          type: "string"
        schemaVersion:
          type: "integer"
    SyncRegisterResponse:
      type: "object"
      additionalProperties: false
      required:
        - "deviceId"
        - "authorityMode"
        - "schemaVersion"
        - "scopeVersion"
      properties:
        deviceId:
          type: "string"
        authorityMode:
          type: "string"
        schemaVersion:
          type: "integer"
        scopeVersion:
          type: "integer"
    SyncBootstrapRequest:
      type: "object"
      additionalProperties: false
      required:
        - "deviceId"
        - "schemaVersion"
      properties:
        deviceId:
          type: "string"
        schemaVersion:
          type: "integer"
    SyncGrant:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "tenant"
        - "user"
        - "deviceId"
        - "scopeVersion"
        - "issuedAt"
        - "expiresAt"
        - "commands"
        - "owners"
        - "risk"
        - "signedEnvelope"
      properties:
        id:
          type: "string"
        tenant:
          type: "string"
        user:
          type: "string"
        deviceId:
          type: "string"
        scopeVersion:
          type: "integer"
        issuedAt:
          type: "string"
        expiresAt:
          type: "string"
        commands:
          type: "array"
          items:
            type: "string"
        owners:
          type: "array"
          items:
            type: "string"
        risk:
          type: "string"
        signedEnvelope:
          type: "string"
    SyncBootstrapResponse:
      type: "object"
      additionalProperties: false
      required:
        - "authorityMode"
        - "schemaVersion"
        - "scopeVersion"
        - "initialCursor"
        - "grants"
      properties:
        authorityMode:
          type: "string"
        schemaVersion:
          type: "integer"
        scopeVersion:
          type: "integer"
        initialCursor:
          type: "string"
        grants:
          type: "array"
          items:
            $ref: "#/components/schemas/SyncGrant"
    SyncPushRequest:
      type: "object"
      additionalProperties: false
      required:
        - "deviceId"
        - "scopeVersion"
        - "schemaVersion"
        - "commands"
      properties:
        deviceId:
          type: "string"
        scopeVersion:
          type: "integer"
        schemaVersion:
          type: "integer"
        commands:
          type: "array"
          items:
            $ref: "#/components/schemas/SyncCommand"
    SyncPushResponse:
      type: "object"
      additionalProperties: false
      required:
        - "results"
        - "serverTime"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/SyncResult"
        serverTime:
          type: "string"
    SyncPullRequest:
      type: "object"
      additionalProperties: false
      required:
        - "deviceId"
        - "scopeVersion"
        - "cursor"
      properties:
        deviceId:
          type: "string"
        scopeVersion:
          type: "integer"
        cursor:
          type: "string"
        limit:
          type: "integer"
    SyncChange:
      type: "object"
      additionalProperties: false
      required:
        - "seq"
        - "entityType"
        - "entityId"
        - "op"
        - "projection"
      properties:
        seq:
          type: "string"
        entityType:
          type: "string"
        entityId:
          type: "string"
        entityVersion:
          type: "integer"
        op:
          type: "string"
          enum:
            - "UPSERT"
            - "PURGE"
        projection:
          type: "object"
          additionalProperties: true
    SyncPullResponse:
      type: "object"
      additionalProperties: false
      required:
        - "changes"
        - "nextCursor"
        - "hasMore"
        - "resetRequired"
      properties:
        changes:
          type: "array"
          items:
            $ref: "#/components/schemas/SyncChange"
        nextCursor:
          type: "string"
        hasMore:
          type: "boolean"
        resetRequired:
          type: "boolean"
        code:
          type: "string"
    SyncAckRequest:
      type: "object"
      additionalProperties: false
      required:
        - "deviceId"
        - "scopeVersion"
        - "cursor"
      properties:
        deviceId:
          type: "string"
        scopeVersion:
          type: "integer"
        cursor:
          type: "string"
    SyncAckResponse:
      type: "object"
      additionalProperties: false
      required:
        - "acknowledged"
      properties:
        acknowledged:
          type: "boolean"
    SyncHealthResponse:
      type: "object"
      additionalProperties: false
      required:
        - "authorityMode"
        - "schemaVersion"
        - "serverTime"
      properties:
        authorityMode:
          type: "string"
        schemaVersion:
          type: "integer"
        serverTime:
          type: "string"
    SyncUploadResponse:
      type: "object"
      additionalProperties: false
      required:
        - "attachmentId"
        - "state"
        - "sizeBytes"
        - "chunkSizeBytes"
        - "resumable"
      properties:
        attachmentId:
          type: "string"
        state:
          type: "string"
        sizeBytes:
          type: "integer"
        chunkSizeBytes:
          type: "integer"
        resumable:
          type: "boolean"
        session:
          type: "string"
    SyncPartResponse:
      type: "object"
      additionalProperties: false
      required:
        - "partNumber"
        - "sha256"
        - "sizeBytes"
      properties:
        partNumber:
          type: "integer"
        sha256:
          type: "string"
        sizeBytes:
          type: "integer"
    SyncCompleteRequest:
      type: "object"
      additionalProperties: false
      required:
