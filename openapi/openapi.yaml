openapi: 3.1.0
info:
  title: AgroPlatform API
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: WP49-001 local bootstrap shell
paths:
  /v1/sync/devices/register:
    post:
      operationId: "registerSyncDevice"
      summary: "DOC12 registerSyncDevice"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRegisterResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRegisterRequest"
  /v1/sync/bootstrap:
    post:
      operationId: "bootstrapSync"
      summary: "DOC12 bootstrapSync"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncBootstrapResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBootstrapRequest"
  /v1/sync/push:
    post:
      operationId: "pushSync"
      summary: "DOC12 pushSync"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
  /v1/sync/pull:
    post:
      operationId: "pullSync"
      summary: "DOC12 pullSync"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPullRequest"
  /v1/sync/ack:
    post:
      operationId: "ackSync"
      summary: "DOC12 ackSync"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAckResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAckRequest"
  /v1/sync/health:
    get:
      operationId: "syncHealth"
      summary: "DOC12 syncHealth"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncHealthResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
  /v1/attachments/init:
    post:
      operationId: "initSyncAttachment"
      summary: "DOC12 initSyncAttachment"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncUploadResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAttachmentIntent"
  /v1/attachments/{localId}/parts/{number}:
    put:
      operationId: "putSyncAttachmentPart"
      summary: "DOC12 putSyncAttachmentPart"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
        -
          name: "localId"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "number"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "X-Remote-Id"
          in: "header"
          required: true
          schema:
            type: "string"
        -
          name: "X-Part-Sha256"
          in: "header"
          required: true
          schema:
            type: "string"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPartResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 5242880
  /v1/attachments/{localId}/complete:
    post:
      operationId: "completeSyncAttachment"
      summary: "DOC12 completeSyncAttachment"
      description: "LOCAL_PRIMARY only. Session and registered device binding required; server current owner-module permissions and domain validation deny by default. No offline snapshot authorizes canonical writes. Push <=50 commands/1 MiB; pull <=500 records/2 MiB; 90-day signed cursor reset preserves pending intents. Upload requires owner file policy."
      parameters:
        -
          $ref: "#/components/parameters/IdentityAuthorization"
        -
          name: "localId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        '200':
          description: "Protocol result; inspect per-command status or resetRequired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAttachmentResponse"
        '400':
          description: "Schema/envelope/batch invalid; explicit forced upgrade for unsupported schema"
        '401':
          description: "Session expired or revoked; reauthenticate without losing queue"
        '403':
          description: "Authority/device/current permissions denied"
        '409':
          description: "Scope/sequence or immutable idempotency mismatch"
        '429':
          description: "Retry after Retry-After"
        '503':
          description: "Retry after backoff, retaining stable IDs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncCompleteRequest"
  /v1/auth/login:
    post:
      operationId: login
      summary: Authenticate a local account
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication result or MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Generic authentication failure
        '503':
          description: Authentication service unavailable
  /v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Verify a one-time MFA challenge
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Authenticated session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Generic challenge or TOTP failure
        '503':
          description: Authentication service unavailable
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh credential
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Generic refresh failure
        '503':
          description: Authentication service unavailable
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current authenticated session
      parameters:
        - $ref: '#/components/parameters/IdentityAuthorization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current session revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationResponse'
        '401':
          description: Authentication required
        '503':
          description: Authentication service unavailable
  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: List sessions owned by the authenticated user
      parameters:
        - $ref: '#/components/parameters/IdentityAuthorization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Sessions owned by the authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Authentication required
        '503':
          description: Authentication service unavailable
  /v1/me/sessions/{id}/commands/revoke:
    post:
      operationId: revokeMySession
      summary: Revoke a selected session owned by the authenticated user
      parameters:
        - $ref: '#/components/parameters/IdentityAuthorization'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationResponse'
        '401':
          description: Authentication required
        '404':
          description: Session not found for authenticated user
        '503':
          description: Authentication service unavailable
  /system/schema-version:
    get:
      operationId: getSchemaVersion
      summary: Read the applied database schema version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current database and PostGIS schema-version state
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersionResponse'
        '503':
          description: Database schema version is unavailable
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersionUnavailableResponse'
  /health/live:
    get:
      operationId: getLiveness
      summary: Check API process liveness
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: API process is alive
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check API and required database readiness
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: API and database are ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: API database dependency is not ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /metrics:
    get:
      operationId: getMetrics
      summary: Read current API process and HTTP measurements
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current API process and HTTP measurements
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
  /org/tenants:
    post:
      operationId: createOrgTenant
      summary: Create a tenant in the local organization hierarchy
      parameters:
        - $ref: '#/components/parameters/BootstrapAuthorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created or returned from an idempotent retry
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.tenant.create
        '409':
          description: Duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/organizations:
    post:
      operationId: createOrgOrganization
      summary: Create an organization within a tenant
      parameters:
        - $ref: '#/components/parameters/BootstrapAuthorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created or returned from an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.organization.create
        '409':
          description: Invalid tenant, duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/organization-units:
    post:
      operationId: createOrgOrganizationUnit
      summary: Create an organization unit under an organization or parent unit
      parameters:
        - $ref: '#/components/parameters/BootstrapAuthorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationUnitRequest'
      responses:
        '201':
          description: Organization unit created or returned from an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.organization_unit.create
        '409':
          description: Invalid parent, cross-organization reference, duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/sites:
    post:
      operationId: createOrgSite
      summary: Create a physical site belonging to one organization
      parameters:
        - $ref: '#/components/parameters/BootstrapAuthorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created or returned from an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.site.create
        '409':
          description: Invalid organization/unit, duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/tenants/{tenantId}/hierarchy:
    get:
      operationId: getOrgHierarchy
      summary: Read a tenant and all organization units and sites in its hierarchy
      parameters:
        - $ref: '#/components/parameters/BootstrapAuthorization'
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant hierarchy snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyResponse'
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.hierarchy.read
        '404':
          description: Tenant not found
        '503':
          description: PostgreSQL unavailable
components:
  parameters:
    BootstrapAuthorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Server-issued Bearer bootstrap credential.
    IdentityAuthorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer access JWT issued by the local identity module.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: Optional bounded request correlation identifier; invalid values are replaced.
    CausationId:
      name: X-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    CorrelationId:
      description: Correlation identifier assigned to this request.
      schema:
        type: string
  schemas:
    SyncAggregate:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "id"
      properties:
        type:
          type: "string"
        id:
          type: "string"
    SyncAttachmentIntent:
      type: "object"
      additionalProperties: false
      required:
        - "localAttachmentId"
        - "ownerRef"
        - "evidenceType"
        - "sha256"
        - "mime"
        - "sizeBytes"
        - "required"
      properties:
        localAttachmentId:
          type: "string"
        ownerRef:
          type: "string"
        evidenceType:
          type: "string"
        sha256:
          type: "string"
        mime:
          type: "string"
        sizeBytes:
          type: "integer"
        required:
          type: "boolean"
    SyncCommand:
      type: "object"
      additionalProperties: false
      required:
        - "localCommandId"
        - "idempotencyKey"
        - "deviceSeq"
        - "aggregate"
        - "type"
        - "commandVersion"
        - "observedAt"
        - "offlineAuthId"
        - "payload"
        - "provenance"
        - "attachments"
      properties:
        localCommandId:
          type: "string"
        idempotencyKey:
          type: "string"
        deviceSeq:
          type: "integer"
        aggregate:
          $ref: "#/components/schemas/SyncAggregate"
        baseVersion:
          type: "integer"
        type:
          type: "string"
        commandVersion:
          type: "integer"
        observedAt:
          type: "string"
        offlineAuthId:
          type: "string"
        payload:
          type: "object"
          additionalProperties: true
        provenance:
          type: "object"
          additionalProperties: true
        attachments:
          type: "array"
          items:
            $ref: "#/components/schemas/SyncAttachmentIntent"
    SyncResult:
      type: "object"
      additionalProperties: false
      required:
        - "localCommandId"
        - "status"
        - "receivedAt"
      properties:
        localCommandId:
          type: "string"
        status:
          type: "string"
          enum:
            - "ACCEPTED"
            - "CONFLICT"
