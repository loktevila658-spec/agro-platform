              - "assign"
              - "accept"
              - "start"
              - "pause"
              - "resume"
              - "complete"
              - "verify"
              - "close"
              - "return"
              - "cancel"
              - "abort"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/TaskSubmitRequest"
      "responses":
        "200":
          "description": "Task owner result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/SyncPushResponse"
        "400":
          "description": "Invalid command"
        "401":
          "description": "Authentication required"
        "403":
          "description": "Current permission denied"
        "404":
          "description": "Not available"
        "409":
          "description": "Explicit version or state conflict"
  "/v1/offline-gis/sources":
    "get":
