          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
        - refreshExpiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - mfaRequired
      properties:
        mfaRequired:
          type: boolean
        challengeToken:
          type: string
        expiresIn:
          type: integer
        accessToken:
          type: string
        tokenType:
          type: string
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
    RevocationResponse:
      type: object
      additionalProperties: false
      required:
        - revoked
      properties:
        revoked:
          type: boolean
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - deviceId
        - deviceLabel
        - authStrength
        - createdAt
        - lastSeenAt
        - expiresAt
        - revoked
        - current
      properties:
        sessionId:
          type: string
        deviceId:
          type: string
        deviceLabel:
          type: string
        authStrength:
          type: string
        createdAt:
          type: string
        lastSeenAt:
          type: string
        expiresAt:
          type: string
        revoked:
          type: boolean
        current:
