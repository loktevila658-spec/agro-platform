openapi: 3.1.0
info:
  title: AgroPlatform API
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: WP49-001 local bootstrap shell
paths:
  /system/schema-version:
    get:
      operationId: getSchemaVersion
      summary: Read the applied database schema version
      parameters:
      responses:
        '200':
          description: Current database and PostGIS schema-version state
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersionResponse'
        '503':
          description: Database schema version is unavailable
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersionUnavailableResponse'
  /health/live:
    get:
      operationId: getLiveness
      summary: Check API process liveness
      parameters:
      responses:
        '200':
          description: API process is alive
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check API and required database readiness
      parameters:
      responses:
        '200':
          description: API and database are ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: API database dependency is not ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /metrics:
    get:
      operationId: getMetrics
      summary: Read current API process and HTTP measurements
      parameters:
      responses:
        '200':
          description: Current API process and HTTP measurements
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
  /org/tenants:
    post:
      operationId: createOrgTenant
      summary: Create a tenant in the local organization hierarchy
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created or returned from an idempotent retry
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.tenant.create
        '409':
          description: Duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/organizations:
    post:
      operationId: createOrgOrganization
      summary: Create an organization within a tenant
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created or returned from an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.organization.create
        '409':
          description: Invalid tenant, duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/organization-units:
    post:
      operationId: createOrgOrganizationUnit
      summary: Create an organization unit under an organization or parent unit
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationUnitRequest'
      responses:
        '201':
          description: Organization unit created or returned from an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.organization_unit.create
        '409':
          description: Invalid parent, cross-organization reference, duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/sites:
    post:
      operationId: createOrgSite
      summary: Create a physical site belonging to one organization
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created or returned from an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.site.create
        '409':
          description: Invalid organization/unit, duplicate code or incompatible idempotency-key reuse
        '503':
          description: PostgreSQL unavailable
  /org/tenants/{tenantId}/hierarchy:
    get:
      operationId: getOrgHierarchy
      summary: Read a tenant and all organization units and sites in its hierarchy
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant hierarchy snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyResponse'
        '401':
          description: Missing or invalid server-issued bootstrap credential
        '403':
          description: Actor lacks org.hierarchy.read
        '404':
          description: Tenant not found
        '503':
          description: PostgreSQL unavailable
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Server-issued Bearer bootstrap credential.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: Optional bounded request correlation identifier; invalid values are replaced.
    CausationId:
      name: X-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    CorrelationId:
      description: Correlation identifier assigned to this request.
      schema:
        type: string
  schemas:
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - databaseStatus
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        databaseStatus:
          type: string
          enum:
            - current
            - unavailable
            - behind
            - ahead
    MetricsResponse:
      type: object
      additionalProperties: false
      required:
        - processUptimeSeconds
        - processHeapUsedBytes
        - processResidentSetBytes
        - httpRequestCount
        - httpRequestDurationMsTotal
        - httpStatus2xxCount
        - httpStatus3xxCount
        - httpStatus4xxCount
        - httpStatus5xxCount
      properties:
        processUptimeSeconds:
          type: number
        processHeapUsedBytes:
          type: integer
        processResidentSetBytes:
          type: integer
        httpRequestCount:
          type: integer
        httpRequestDurationMsTotal:
          type: number
        httpStatus2xxCount:
          type: integer
        httpStatus3xxCount:
          type: integer
        httpStatus4xxCount:
          type: integer
        httpStatus5xxCount:
          type: integer
    SchemaVersionResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - expectedSchemaVersion
        - postgisVersion
        - status
      properties:
        schemaVersion:
          type: integer
        expectedSchemaVersion:
          type: integer
        postgisVersion:
          type: string
        status:
          type: string
          enum:
            - current
            - behind
            - ahead
    SchemaVersionUnavailableResponse:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - timezone
      properties:
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
    TenantResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - timezone
        - createdAt
        - correlationId
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
        correlationId:
          type: string
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - code
        - name
        - organizationType
      properties:
        tenantId:
          type: string
        code:
          type: string
        name:
          type: string
        organizationType:
          type: string
          enum:
            - LEGAL_ENTITY
            - SOLE_PROPRIETOR
            - FARM
            - OPERATING_UNIT
    OrganizationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - code
        - name
        - organizationType
        - createdAt
        - correlationId
      properties:
        id:
          type: string
        tenantId:
          type: string
        code:
          type: string
        name:
          type: string
        organizationType:
          type: string
        createdAt:
          type: string
        correlationId:
          type: string
    CreateOrganizationUnitRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - organizationId
        - code
        - name
        - unitType
      properties:
        tenantId:
          type: string
        organizationId:
          type: string
        parentId:
          type: string
        code:
          type: string
        name:
          type: string
        unitType:
          type: string
    OrganizationUnitResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - organizationId
        - code
        - name
        - unitType
        - createdAt
        - correlationId
      properties:
        id:
          type: string
        tenantId:
          type: string
        organizationId:
          type: string
        parentId:
          type: string
        code:
          type: string
        name:
          type: string
        unitType:
          type: string
        createdAt:
          type: string
        correlationId:
          type: string
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - organizationId
        - code
        - name
        - siteType
        - timezone
      properties:
        tenantId:
          type: string
        organizationId:
          type: string
        organizationUnitId:
          type: string
        code:
          type: string
        name:
          type: string
        siteType:
          type: string
          enum:
            - BASE
            - FARM
            - WAREHOUSE_SITE
            - WEIGH_SITE
            - PRODUCTION_SITE
            - REPAIR_BASE
            - FUEL_SITE
        address:
          type: string
        timezone:
          type: string
    SiteResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - organizationId
        - code
        - name
        - siteType
        - timezone
        - createdAt
        - correlationId
      properties:
        id:
          type: string
        tenantId:
          type: string
        organizationId:
          type: string
        organizationUnitId:
          type: string
        code:
          type: string
        name:
          type: string
        siteType:
          type: string
        address:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
        correlationId:
          type: string
    HierarchyResponse:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - tenantCode
        - tenantName
        - organizationsJson
        - organizationUnitsJson
        - sitesJson
      properties:
        tenantId:
          type: string
        tenantCode:
          type: string
        tenantName:
          type: string
        organizationsJson:
          type: string
          description: JSON-encoded array of organizations.
        organizationUnitsJson:
          type: string
          description: JSON-encoded array of organizational units.
        sitesJson:
          type: string
          description: JSON-encoded array of sites.
x-status: BOOTSTRAP
x-sources:
  - DOC28
  - DOC49
  - DOC50
