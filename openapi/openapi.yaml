          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Authorized derived delivery result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OfflineGisCandidates"
  "/v1/offline-gis/packages/{packageId}":
    "get":
      "operationId": "offlineGisRead"
      "parameters":
        -
