          "description": "Task owner result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TaskProjection"
        "400":
          "description": "Invalid command"
        "401":
          "description": "Authentication required"
        "403":
          "description": "Current permission denied"
        "404":
          "description": "Not available"
        "409":
          "description": "Explicit version or state conflict"
  "/v1/tasks/{taskId}/commands/{action}":
    "post":
      "operationId": "taskCommand"
      "summary": "Versioned task owner boundary"
      "parameters":
        -
          "$ref": "#/components/parameters/IdentityAuthorization"
        -
          "name": "taskId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "action"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "enum":
