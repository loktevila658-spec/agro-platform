    SyncAttachmentResponse:
      type: "object"
      additionalProperties: false
      required:
        - "attachmentId"
        - "localAttachmentId"
        - "state"
        - "sizeBytes"
        - "chunkSizeBytes"
        - "resumable"
        - "sha256"
        - "mime"
        - "ownerRef"
        - "evidenceType"
      properties:
        attachmentId:
          type: "string"
        localAttachmentId:
          type: "string"
        state:
          type: "string"
        sizeBytes:
          type: "integer"
        chunkSizeBytes:
          type: "integer"
        resumable:
          type: "boolean"
        sha256:
          type: "string"
        mime:
          type: "string"
        ownerRef:
          type: "string"
        evidenceType:
          type: "string"
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
        - deviceId
      properties:
        login:
          type: string
        password:
          type: string
        deviceId:
          type: string
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challengeToken
        - code
      properties:
        challengeToken:
          type: string
