        -
          "$ref": "#/components/parameters/CorrelationId"
      "responses":
        "200":
          "description": "Authorized derived delivery result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OfflineGisSources"
  "/v1/offline-gis/fields":
    "get":
      "operationId": "offlineGisFields"
