name: agroplatform-bootstrap

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"

  workers:
    build:
      context: ..
      dockerfile: apps/workers/Dockerfile

  ai:
    build:
      context: ..
      dockerfile: apps/ai/Dockerfile
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
