  value: 315/315
  status: COMMITTED; исходные ID сохраняются.
- baseline: Market delta
  value: 133/133
  status: 'Frozen decisions: ENHANCE / OPTIONAL / VERTICAL / INTEGRATION / FUTURE / REJECTED.'
- baseline: Documents
  value: 1–50
  status: Полная серия спецификаций.
- baseline: Work Packages
  value: '94'
  status: WP49-001…094; DAG без циклов.
- baseline: Build waves
  value: '12'
