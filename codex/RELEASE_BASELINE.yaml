- id: RG-V1-1
  condition: Planning/remote sensing/fuel/quality/OEE/maintenance/logistics/commercial/economics/workforce/control tower PASS
- id: RG-V1-2
  condition: Enterprise performance & security thresholds PASS
- id: RG-V1-3
