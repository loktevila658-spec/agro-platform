releases:
- id: MVP
  gate: 'Core chain работает offline/local-first: field -> task -> harvest -> weighing -> warehouse -> production -> finished
    batch; permissions/audit/1C skeleton/demo/DR PASS.'
  meaning: Release-blocking.
- id: V1
  gate: Planning, remote sensing, fuel, quality, OEE, maintenance, yard/WMS/TMS-lite, supply/sales, economics/workforce/control
    tower operationally complete.
  meaning: First full operating platform.
- id: V1.5
  gate: Advanced grain, agrochemistry, auto work fact, S&OP, AI gateway, SDKs and more automation accepted.
  meaning: Advanced automation.
- id: V2
  gate: ISOBUS/J1939/RTK, richer retrofit/AI/device SDK/vertical packages after separate acceptance.
  meaning: Hardware/vertical expansion.
- id: FUTURE
  gate: Only frozen hooks/contracts; not blocking release.
  meaning: No-build unless CR promotes scope.
