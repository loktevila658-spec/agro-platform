dependency_policy:
- id: BG-001
  rule: Codex меняет только allowedPaths текущего WP.
- id: BG-002
  rule: Любая необходимость изменить deniedPaths останавливает WP и создаёт change request.
- id: BG-003
  rule: Cross-module read разрешён только через public application/query contract или read model.
- id: BG-004
  rule: Cross-module write возможен только через command/API/event contract владельца домена.
- id: BG-005
  rule: Прямой UPDATE чужой таблицы запрещён даже внутри одной PostgreSQL БД.
- id: BG-006
  rule: Новый event требует schema, version, producer, consumers и contract tests.
- id: BG-007
  rule: Новый endpoint требует OpenAPI и permission mapping.
- id: BG-008
  rule: Новая authoritative сущность требует SoT/provenance/retention/audit решения.
- id: BG-009
  rule: Новый offline write требует ProvisionalCommand/idempotency/conflict policy.
- id: BG-010
  rule: Новый device signal сначала становится evidence; бизнес-факт создаётся domain workflow.
- id: BG-011
  rule: Новый AI output — recommendation/proposal; authoritative mutation только доменной командой.
- id: BG-012
  rule: Схема БД не меняется ORM auto-sync; только versioned migrations.
- id: BG-013
  rule: Каждый breaking change проходит expand/migrate/contract или совместимый эквивалент.
- id: BG-014
  rule: Generated clients обновляются из канонических contracts, а не вручную.
- id: BG-015
  rule: Нельзя ослаблять acceptance test ради прохождения реализации без отдельного approved change.
execution_dependency_source: build-graph.yaml / WP49 manifests
note: No speculative module-to-module edges are added here; concrete implementation dependencies must be justified by frozen
  WP/spec contracts.
